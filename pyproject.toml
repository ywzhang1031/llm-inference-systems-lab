[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference-systems-lab"
version = "0.1.0"
description = "A learning-driven, reproducible lab for LLM serving benchmarks."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Evan"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
